interface:
  display_name: "DTF Transfer POD Listing"
  short_description: "七图分工、多底色主图、三维尺寸；图片工具完成图文，PS只做印花PSD"
  default_prompt: "使用 $dtf-transfer-pod-listing，按固定七图分工制作，同印花多底色主图、逐格配短说明的细节图和长高厚尺寸；全部图片文字与排版由图片生成工具完成，PS只制作印花PSD。仓库贴标，不做DIY粘贴图或教程视频。标题为可变印花词组加固定产品名称；一个印花一个SKU，七图、印花、文案及总览放一起，PSD直接放产品根目录，中间产物放工作资料，默认不打包；审核定稿后冻结PSD，仅替换印花导出；若已有批准母版或只要总览打包，直接复用对应成果。"
